# Supply-chain policy (engineering plan §6.7). The license allowlist bans
# copyleft (LGPL/MPL/GPL) from the dependency tree — e.g. the LGPL EquiX C
# original and MPL Iron Fish must stay design-references, never deps.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
