p3-baby-bear = "0.6.1"
p3-field = "0.6.1"
p3-poseidon2 = "0.6.1"
rand = "0.10"

[dev-dependencies]
p3-poseidon2-air = "0.6.1"
p3-matrix = "0.6.1"
