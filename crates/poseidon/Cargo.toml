# Shared Poseidon2-over-BabyBear protocol hash (decision D3). The single source
# of round constants and the host permutation used by BOTH the STARK circuit
# (circuit-spend) and the pipeline (notes, tree), so in-circuit and out-of-circuit
# hashing are provably identical.

[lints]
workspace = true

